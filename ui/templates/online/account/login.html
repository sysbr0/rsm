<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SYSBR Restaurant | Login</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b1020;
        color: #f8fafc;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
      }

      .login-card {
        width: 100%;
        max-width: 420px;
        padding: 36px;
        background: #151c2e;
        border: 1px solid #29334a;
        border-radius: 22px;
        box-shadow: 0 24px 70px #0005;
      }

      .brand {
        text-align: center;
        margin-bottom: 32px;
      }

      .logo {
        display: grid;
        place-items: center;
        width: 60px;
        height: 60px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: #7c3aed;
        font-size: 28px;
      }

      h1 {
        margin: 0;
        font-size: 25px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 21px;
      }
      p {
        color: #9ca3b8;
        font-size: 14px;
        line-height: 1.6;
      }

      label {
        display: block;
        margin: 20px 0 8px;
        font-size: 14px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 14px;
        border: 1px solid #35405a;
        border-radius: 11px;
        background: #0e1526;
        color: white;
        font-size: 15px;
        outline: none;
      }

      input:focus {
        border-color: #8b5cf6;
      }

      button {
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        border: 0;
        border-radius: 11px;
        background: #7c3aed;
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #6d28d9;
      }

      .error {
        padding: 12px;
        margin-top: 18px;
        border-radius: 10px;
        background: #7f1d1d55;
        color: #fecaca;
        font-size: 14px;
      }

      .footer {
        margin-top: 24px;
        text-align: center;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <header class="brand">
        <div class="logo">🍽</div>
        <h1>SYSBR Restaurant</h1>
        <p>Restaurant Management Portal</p>
      </header>

      <h2>Welcome back</h2>
      <p>Sign in to manage your restaurant.</p>

      {% if messages %} {% for message in messages %}
      <div class="error" role="alert">{{ message }}</div>
      {% endfor %} {% endif %}

      <form method="post">
        {% csrf_token %}

        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          placeholder="you@restaurant.com"
          value="{{ request.POST.email|default:'' }}"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        />

        <button type="submit">Sign in to your account</button>
      </form>

      <p class="footer">Secure access to your restaurant dashboard</p>
    </main>
  </body>
</html>
